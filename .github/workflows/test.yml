name: Hello World

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  hello:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from GitHub Actions! 🚀"

      - name: Show date
        run: date

      - name: Show who am I
        run: whoami

      - name: Show files
        run: ls -la
